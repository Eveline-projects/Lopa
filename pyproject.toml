[project]
name = "lopa"
version = "0.1.0"
description = "A Django-based coding practice platform for aspiring software architects."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asgiref>=3.11.1",
    "django>=6.0.3",
    "django-crispy-forms>=2.6",
    "django-environ>=0.13.0",
    "django-ninja>=1.6.2",
    "django-widget-tweaks>=1.5.1",
    "pygments>=2.19.2",
    "sqlparse>=0.5.5",
]

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "iniconfig>=2.3.0",
    "packaging>=26.0",
    "pluggy>=1.6.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "pytest-playwright>=0.7.2",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff]
line-length = 79
