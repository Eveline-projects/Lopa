<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LOPA | Architect Practice{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

    <nav class="bg-white border-b border-slate-200 p-4 shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="{% url 'home' %}" class="font-bold text-xl tracking-tight text-indigo-600">LOPA</a>
            <div class="flex items-center space-x-6"> 
            {% if user.is_authenticated %}
                <a href="{% url 'submissions:user_submissions' %}" class="text-sm font-semibold text-slate-600 hover:text-indigo-600 transition-colors">
                    My Submissions
                </a>
                
                <span class="text-sm text-slate-400">|</span> 
                    <span class="text-sm text-slate-500">Hi, {{ user.email }}!</span>
                    <a href="{% url 'logout' %}" class="text-sm font-medium hover:text-indigo-600">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="text-sm font-medium hover:text-indigo-600">Sign in</a>
                    <a href="{% url 'register' %}" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-10 px-4">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="border-t border-slate-200 mt-20 py-8 text-center text-slate-400 text-xs">
        &copy; 2026 LOPA Framework. All rights reserved.
    </footer>

</body>
</html>
