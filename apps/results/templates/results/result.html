{% extends 'base.html' %}

{% block title %}LOPA | Wynik zgłoszenia{% endblock %}

{% block content %}
<div class="min-h-screen bg-surface-container-low p-6 lg:p-12">
    <div class="max-w-3xl mx-auto">
        <div class="mb-8">
            <h1 class="text-3xl font-extrabold text-on-surface tracking-tight">Submission Result</h1>
            <p class="text-on-surface-variant mt-2 font-medium">Sprawdź szczegóły swojego rozwiązania.</p>
        </div>

        <div class="bg-surface-container-high rounded-3xl p-8 border border-outline-variant/10 shadow-sm">
            <div class="flex items-center gap-4 mb-6">
                <div class="w-12 h-12 rounded-2xl bg-primary/10 flex items-center justify-center">
                    <svg class="w-6 h-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="id-card" />
                    </svg>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-on-surface">Status: Processing...</h3>
                    <p class="text-sm text-on-surface-variant">Twój kod jest właśnie testowany.</p>
                </div>
            </div>

            <div class="space-y-4">
                <div class="h-2 w-full bg-outline-variant/20 rounded-full overflow-hidden">
                    <div class="h-full bg-primary w-1/3 animate-pulse"></div>
                </div>
            </div>
        </div>

        <div class="mt-8">
            <a href="{% url 'home' %}" class="inline-flex items-center gap-2 px-6 py-3 bg-primary text-on-primary rounded-full font-bold hover:shadow-lg transition-all">
                Powrót do zadań
            </a>
        </div>
    </div>
</div>
{% endblock %}
