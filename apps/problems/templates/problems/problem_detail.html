{% extends 'base.html' %} {% block content %}
<div class="max-w-4xl mx-auto p-6 md:p-8">
	<div class="mb-6">
		<a
			href="{% url 'problems:problems_list' %}"
			class="text-blue-600 underline"
		>
			← Back to problems
		</a>
	</div>

	<div class="rounded-lg border border-gray-200 bg-white p-6 shadow-sm mb-8">
		<h1 class="text-2xl md:text-3xl font-bold mb-4">{{ problem.title }}</h1>

		<div class="flex flex-wrap gap-2 mb-4 text-sm">
			<span class="rounded bg-gray-100 px-3 py-1"
				>{{ problem.difficulty }}</span
			>
			<span class="rounded bg-gray-100 px-3 py-1">{{ problem.category }}</span>
		</div>

		<p class="text-gray-700 whitespace-pre-line">{{ problem.description }}</p>
	</div>

	<div class="rounded-lg border border-gray-200 bg-white p-6 shadow-sm">
		<h2 class="text-xl font-semibold mb-4">Submit solution</h2>

		<form id="submission-form" class="space-y-4">
			{% csrf_token %}

			<div>
				<label for="code-input" class="block mb-2 font-medium">Your code</label>
				<textarea
					id="code-input"
					name="code"
					rows="16"
					class="w-full rounded-lg border border-gray-300 p-3 font-mono text-sm"
					placeholder="Write your solution here..."
				></textarea>
			</div>

			<button
				type="submit"
				id="submit-btn"
				class="rounded-lg bg-blue-600 px-4 py-2 text-white font-medium hover:bg-blue-700 transition"
			>
				Submit
			</button>

			<p id="submission-status" class="text-sm"></p>
		</form>
	</div>
</div>

<script>
	const form = document.getElementById("submission-form");
	const codeInput = document.getElementById("code-input");
	const submitBtn = document.getElementById("submit-btn");
	const statusEl = document.getElementById("submission-status");
	const csrfToken = document.querySelector("[name=csrfmiddlewaretoken]").value;

	form.addEventListener("submit", async function (event) {
		event.preventDefault();

		const code = codeInput.value.trim();

		if (!code) {
			statusEl.textContent = "Code cannot be empty.";
			statusEl.className = "text-sm text-red-600";
			return;
		}

		submitBtn.disabled = true;
		submitBtn.textContent = "Submitting...";
		statusEl.textContent = "Submitting solution...";
		statusEl.className = "text-sm text-gray-600";

		try {
			const response = await fetch(
				"/api/problems/{{ problem.id }}/submissions/",
				{
					method: "POST",
					headers: {
						"Content-Type": "application/json",
						"X-CSRFToken": csrfToken,
						Accept: "application/json",
					},
					body: JSON.stringify({
						code: code,
					}),
				},
			);

			console.log("STATUS:", response.status);

			if (!response.ok) {
				console.log("Submission endpoint is not available yet.");
				throw new Error("Submission endpoint is not available yet.");
			}

			statusEl.textContent = "Submission request sent successfully.";
			statusEl.className = "text-sm text-green-600";
			codeInput.value = "";
		} catch (error) {
			statusEl.textContent = error.message || "Something went wrong.";
			statusEl.className = "text-sm text-red-600";
		} finally {
			submitBtn.disabled = false;
			submitBtn.textContent = "Submit";
		}
	});
</script>
{% endblock %}
