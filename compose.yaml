services:
  server:
    build:
      context: .
    image: lopa-server:dev
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://lopa:lopa@db:5432/lopa
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed &&
             python manage.py runserver 0.0.0.0:8000"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lopa
      POSTGRES_USER: lopa
      POSTGRES_PASSWORD: lopa
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lopa -d lopa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg-data:
